services:
  wiki:
    image: ${AGENT_WIKI_IMAGE:?set AGENT_WIKI_IMAGE to an exact tag or digest}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    ports:
      - 127.0.0.1:${WIKI_HOST_PORT:-4317}:4317
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      WIKI_ORIGIN: ${WIKI_ORIGIN:?set WIKI_ORIGIN to the canonical HTTPS URL}
      WIKI_DATABASE: /data/search/wiki.sqlite3
      WIKI_LOCAL_LOGIN: "1"
      WIKI_WRITE: "1"
      WIKI_PUSH: ${WIKI_PUSH:-0}
      GIT_AUTHOR_NAME: ${WIKI_GIT_NAME:-Agent Wiki}
      GIT_AUTHOR_EMAIL: ${WIKI_GIT_EMAIL:-agent-wiki@example.invalid}
      GIT_COMMITTER_NAME: ${WIKI_GIT_NAME:-Agent Wiki}
      GIT_COMMITTER_EMAIL: ${WIKI_GIT_EMAIL:-agent-wiki@example.invalid}
    volumes:
      - ${WIKI_MANAGED_ROOT:?set WIKI_MANAGED_ROOT}:/data
      - ${WIKI_CONTENT_REPO:?set WIKI_CONTENT_REPO}:/data/content
      - ${WIKI_CONTROL_DIR:?set WIKI_CONTROL_DIR}:/data/control
